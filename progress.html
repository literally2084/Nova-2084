<section class="page-content">
  <style>
    :root {
      --bg: #000;
      --text: cyan;
      --primary: cyan;
      --warning: #ff0044;
      --border: #00aaaa;
    }

    body {
      margin: 0;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'VT323', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: none;
      image-rendering: pixelated;
    }

    h1.glitch {
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      text-align: center;
      margin: 0 0 1rem;
      animation: glitch-skew 4s infinite;
      position: relative;
    }

    h1.glitch::before,
    h1.glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--bg);
    }
    h1.glitch::before {
      left: 2px;
      text-shadow: -2px 0 #00ffff;
      clip: rect(0,9999px,0,0);
      animation: glitch-anim 2.5s infinite;
    }
    h1.glitch::after {
      left: -2px;
      text-shadow: 2px 0 #ff00ff;
      clip: rect(0,9999px,0,0);
      animation: glitch-anim2 3.5s infinite;
    }

    @keyframes glitch-anim  { 0%,100% { clip: rect(42px,9999px,44px,0) } 5% { clip: rect(17px,9999px,94px,0) } }
    @keyframes glitch-anim2 { 0%,100% { clip: rect(65px,9999px,119px,0) } 10% { clip: rect(37px,9999px,77px,0) } }
    @keyframes glitch-skew  { 0%,100% { transform: skew(0deg) } 10% { transform: skew(2deg) } }

    .progress-grid {
      width: 90vw;
      max-width: 800px;
      display: grid;
      grid-template-columns: 1fr 3fr;
      gap: 1rem 1.5rem;
      align-items: center;
      padding: 1rem;
    }

    .label {
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      text-align: right;
      color: var(--primary);
      text-shadow: 0 0 6px currentColor;
    }

    .bar-container {
      height: 24px;
      background: #111;
      border: 2px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #006633);
      transition: width 1.6s ease-out;
      box-shadow: 0 0 12px var(--primary);
    }

    .percent {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      color: #000;
      text-shadow: 0 0 6px #fff;
      mix-blend-mode: difference;
      pointer-events: none;
    }

    footer {
      margin-top: 3rem;
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      opacity: 0.7;
      text-align: center;
    }

    @media (max-width: 500px) {
      .progress-grid {
        grid-template-columns: 1fr;
        gap: 0.8rem;
      }
      .label { text-align: center; }
    }
  </style>

  <h1 class="glitch" data-text="DEVELOPMENT STATUS">DEVELOPMENT STATUS</h1>
  
  <div class="progress-grid">
    <div class="label">SCRIPT / WRITING</div>
    <div class="bar-container">
      <div class="bar" data-percent="80%"></div>
      <div class="percent">80%</div>
    </div>

    <div class="label">ANIMATION / VISUALS</div>
    <div class="bar-container">
      <div class="bar" data-percent="20%"></div>
      <div class="percent">20%</div>
    </div>

    <div class="label">MUSIC & SOUND DESIGN</div>
    <div class="bar-container">
      <div class="bar" data-percent="40%"></div>
      <div class="percent">40%</div>
    </div>

    <div class="label">VOICE ACTING / CAST</div>
    <div class="bar-container">
      <div class="bar" data-percent="95%"></div>
      <div class="percent">95%</div>
    </div>

    <div class="label">EDITING & POST-PRODUCTION</div>
    <div class="bar-container">
      <div class="bar" data-percent="0"></div>
      <div class="percent">0%</div>
    </div>

    <div class="label">OVERALL PROGRESS</div>
    <div class="bar-container">
      <div class="bar" data-percent="47"></div>
      <div class="percent">47%</div>
    </div>
  </div>

  <footer>
    THE VISIONARY MONITORS ALL PROGRESS.<br>
    COMPLIANCE IS MANDATORY. :)
  </footer>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.bar').forEach(bar => {
      const percent = parseInt(bar.dataset.percent, 10);
      setTimeout(() => {
        bar.style.width = percent + '%';
      }, 600);
    });
  });
  </script>
</section>
