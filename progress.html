<section class="page-content">
  <style>
    :root {
      --bg: #000000;
      --text: #00fff7;
      --primary: #00fff7;
      --warning: #ff0044;
      --border: #00aaaa;
      --glow: rgba(12, 255, 255, 0.8);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'VT323', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      cursor: none;
      image-rendering: pixelated;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        transparent 0,
        transparent 2px,
        rgba(0,0,0,0.35) 2px,
        rgba(0,0,0,0.35) 4px
      );
      background-size: 100% 4px;
      animation: scan 10s linear infinite;
      mix-blend-mode: multiply;
      z-index: 1;
    }

    h1.glitch {
      font-size: clamp(2.5rem, 9vw, 5rem);
      text-align: center;
      margin: 2rem 0 1.5rem;
      animation: glitch-skew 4s infinite;
      position: relative;
      z-index: 2;
    }

    h1.glitch::before,
    h1.glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--bg);
    }
    h1.glitch::before {
      left: 2px;
      text-shadow: -2px 0 #00ffff;
      clip: rect(0,9999px,0,0);
      animation: glitch-anim 2.5s infinite;
    }
    h1.glitch::after {
      left: -2px;
      text-shadow: 2px 0 #ff00ff;
      clip: rect(0,9999px,0,0);
      animation: glitch-anim2 3.5s infinite;
    }

    @keyframes glitch-anim  { 0%,100% { clip: rect(42px,9999px,44px,0) } 5% { clip: rect(17px,9999px,94px,0) } }
    @keyframes glitch-anim2 { 0%,100% { clip: rect(65px,9999px,119px,0) } 10% { clip: rect(37px,9999px,77px,0) } }
    @keyframes glitch-skew  { 0%,100% { transform: skew(0deg) } 10% { transform: skew(2deg) } }
    @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }

    .progress-grid {
      width: 90vw;
      max-width: 900px;
      display: grid;
      grid-template-columns: minmax(160px, auto) 1fr;
      gap: 1.2rem 2rem;
      align-items: center;
      padding: 1rem 0;
      z-index: 2;
    }

    .label {
      font-size: clamp(1.4rem, 5vw, 2rem);
      text-align: right;
      color: var(--primary);
      text-shadow: 0 0 8px currentColor;
      white-space: nowrap;
    }

    .bar-container {
      height: 32px;
      background: #0a0a0a;
      border: 2px solid var(--border);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.8);
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #004d33);
      transition: width 0s;
      box-shadow: 0 0 15px var(--primary);
      position: relative;
    }

    .percent {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.2rem, 4.5vw, 1.6rem);
      color: #000;
      text-shadow: 0 0 8px #fff;
      mix-blend-mode: difference;
      pointer-events: none;
      font-weight: bold;
    }

    footer {
      margin-top: 4rem;
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      opacity: 0.7;
      text-align: center;
      padding: 1rem;
      z-index: 2;
    }

    @media (max-width: 600px) {
      .progress-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .label { text-align: center; }
      .bar-container { height: 36px; }
    }
  </style>

  <h1 class="glitch" data-text="DEVELOPMENT STATUS">DEVELOPMENT STATUS</h1>
  
  <div class="progress-grid">
    <div class="label">SCRIPT / WRITING</div>
    <div class="bar-container">
      <div class="bar" data-percent="80%"></div>
      <div class="percent">80%</div>
    </div>

    <div class="label">ANIMATION / VISUALS</div>
    <div class="bar-container">
      <div class="bar" data-percent="20%"></div>
      <div class="percent">20%</div>
    </div>

    <div class="label">MUSIC & SOUND DESIGN</div>
    <div class="bar-container">
      <div class="bar" data-percent="40%"></div>
      <div class="percent">40%</div>
    </div>

    <div class="label">VOICE ACTING / CAST</div>
    <div class="bar-container">
      <div class="bar" data-percent="95%"></div>
      <div class="percent">95%</div>
    </div>

    <div class="label">EDITING & POST-PRODUCTION</div>
    <div class="bar-container">
      <div class="bar" data-percent="0"></div>
      <div class="percent">0%</div>
    </div>

    <div class="label">OVERALL PROGRESS</div>
    <div class="bar-container">
      <div class="bar" data-percent="47"></div>
      <div class="percent">47%</div>
    </div>
  </div>

  <footer>
    THE VISIONARY MONITORS ALL PROGRESS.<br>
    COMPLIANCE IS MANDATORY. :)
  </footer>

  <script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const bars = document.querySelectorAll('.bar');
  
      bars.forEach((bar, index) => {
        const target = parseInt(bar.dataset.percent || 0, 10);
        const percentText = bar.parentElement.querySelector('.percent');

        bar.style.width = '0%';
        percentText.textContent = '0%';

        let startTime = null;
        const duration = 2200;

        function animate(time) {
          if (!startTime) startTime = time;
          const elapsed = time - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = Math.round(target * eased);

          bar.style.width = current + '%';
          percentText.textContent = current + '%';

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            bar.style.width = target + '%';
            percentText.textContent = target + '%';
          }
        }

        setTimeout(() => {
          requestAnimationFrame(animate);
        }, 800 + index * 400);
      });
    }, 500);
  });

  const overallBar = document.querySelector('.bar[data-percent="47"]');
  const allPercents = Array.from(document.querySelectorAll('.bar:not([data-percent="47"])'))
    .map(b => parseInt(b.dataset.percent, 10));
  const avg = Math.round(allPercents.reduce((a, b) => a + b, 0) / allPercents.length);
  overallBar.dataset.percent = avg;
  </script>
</section>
