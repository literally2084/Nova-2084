<section class="page-content">
  <style>
    :root {
      --bg: #000000;
      --text: #00fff7;
      --primary: #00fff7;
      --warning: #ff0044;
      --border: #00aaaa;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'VT323', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      cursor: none;
      image-rendering: pixelated;
    }

    h1.glitch {
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      text-align: center;
      margin: 2rem 0 1.5rem;
      animation: glitch-skew 4s infinite;
      position: relative;
    }

    h1.glitch::before,
    h1.glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--bg);
    }
    h1.glitch::before {
      left: 2px;
      text-shadow: -2px 0 #00ffff;
      clip: rect(0,9999px,0,0);
      animation: glitch-anim 2.5s infinite;
    }
    h1.glitch::after {
      left: -2px;
      text-shadow: 2px 0 #ff00ff;
      clip: rect(0,9999px,0,0);
      animation: glitch-anim2 3.5s infinite;
    }

    @keyframes glitch-anim  { 0%,100% { clip: rect(42px,9999px,44px,0) } 5% { clip: rect(17px,9999px,94px,0) } }
    @keyframes glitch-anim2 { 0%,100% { clip: rect(65px,9999px,119px,0) } 10% { clip: rect(37px,9999px,77px,0) } }
    @keyframes glitch-skew  { 0%,100% { transform: skew(0deg) } 10% { transform: skew(2deg) } }

    .progress-grid {
      width: 90vw;
      max-width: 900px;
      display: grid;
      grid-template-columns: minmax(140px, 1fr) 3fr;
      gap: 1.2rem 2rem;
      align-items: center;
      padding: 1rem 0;
    }

    .label {
      font-size: clamp(1.3rem, 4.5vw, 1.9rem);
      text-align: right;
      color: var(--primary);
      text-shadow: 0 0 6px currentColor;
      white-space: nowrap;
    }

    .bar-container {
      height: 28px;
      background: #111;
      border: 2px solid var(--border);
      position: relative;
      overflow: hidden;
      border-radius: 0;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #006633);
      transition: width 0s;
      box-shadow: 0 0 12px var(--primary);
    }

    .percent {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      color: #000;
      text-shadow: 0 0 6px #fff;
      mix-blend-mode: difference;
      pointer-events: none;
      font-weight: bold;
    }

    footer {
      margin-top: 4rem;
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      opacity: 0.7;
      text-align: center;
      padding: 1rem;
    }

    @media (max-width: 600px) {
      .progress-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .label { text-align: center; }
      .bar-container { height: 32px; }
    }
  </style>

  <h1 class="glitch" data-text="DEVELOPMENT STATUS">DEVELOPMENT STATUS</h1>
  
  <div class="progress-grid">
    <div class="label">SCRIPT / WRITING</div>
    <div class="bar-container">
      <div class="bar" data-percent="80%"></div>
      <div class="percent">80%</div>
    </div>

    <div class="label">ANIMATION / VISUALS</div>
    <div class="bar-container">
      <div class="bar" data-percent="20%"></div>
      <div class="percent">20%</div>
    </div>

    <div class="label">MUSIC & SOUND DESIGN</div>
    <div class="bar-container">
      <div class="bar" data-percent="40%"></div>
      <div class="percent">40%</div>
    </div>

    <div class="label">VOICE ACTING / CAST</div>
    <div class="bar-container">
      <div class="bar" data-percent="95%"></div>
      <div class="percent">95%</div>
    </div>

    <div class="label">EDITING & POST-PRODUCTION</div>
    <div class="bar-container">
      <div class="bar" data-percent="0"></div>
      <div class="percent">0%</div>
    </div>

    <div class="label">OVERALL PROGRESS</div>
    <div class="bar-container">
      <div class="bar" data-percent="47"></div>
      <div class="percent">47%</div>
    </div>
  </div>

  <footer>
    THE VISIONARY MONITORS ALL PROGRESS.<br>
    COMPLIANCE IS MANDATORY. :)
  </footer>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const bars = document.querySelectorAll('.bar');
    let delay = 400;

    bars.forEach(bar => {
      const targetPercent = parseInt(bar.dataset.percent, 10);
      const percentText = bar.parentElement.querySelector('.percent');

      setTimeout(() => {
        let start = 0;
        const duration = 1800; 
        const startTime = performance.now();

        function animate(time) {
          const elapsed = time - startTime;
          const progress = Math.min(elapsed / duration, 1);
        
          const eased = 1 - Math.pow(1 - progress, 4);
          const current = Math.floor(start + (targetPercent - start) * eased);

          bar.style.width = current + '%';
          percentText.textContent = current + '%';

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            bar.style.width = targetPercent + '%';
            percentText.textContent = targetPercent + '%';
          }
        }

        requestAnimationFrame(animate);
      }, delay);

      delay += 600;
    });
  });
  </script>
</section>
